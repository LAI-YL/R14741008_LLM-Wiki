<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>查核流程</title>
  <path d="M90 120 H1110" stroke="#D9D4C7" stroke-width="6" stroke-linecap="round"/>
  <circle cx="100" cy="120" r="46" fill="#1F3A5F"/>
  <text x="100" y="138" font-size="46" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">1</text>
  <text x="100" y="222" font-size="24" fill="#1D2433" font-weight="700" text-anchor="middle">確認獨立性</text>
  <text x="100" y="254" font-size="24" fill="#1D2433" font-weight="700" text-anchor="middle">承接前提</text>
  <circle cx="300" cy="120" r="46" fill="#1F3A5F"/>
  <text x="300" y="138" font-size="46" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">2</text>
  <text x="300" y="222" font-size="24" fill="#1D2433" font-weight="700" text-anchor="middle">規劃與</text>
  <text x="300" y="254" font-size="24" fill="#1D2433" font-weight="700" text-anchor="middle">風險評估</text>
  <circle cx="500" cy="120" r="46" fill="#1F3A5F"/>
  <text x="500" y="138" font-size="46" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">3</text>
  <text x="500" y="222" font-size="24" fill="#1D2433" font-weight="700" text-anchor="middle">了解與測試</text>
  <text x="500" y="254" font-size="24" fill="#1D2433" font-weight="700" text-anchor="middle">內部控制</text>
  <circle cx="700" cy="120" r="46" fill="#1F3A5F"/>
  <text x="700" y="138" font-size="46" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">4</text>
  <text x="700" y="222" font-size="24" fill="#1D2433" font-weight="700" text-anchor="middle">取得</text>
  <text x="700" y="254" font-size="24" fill="#1D2433" font-weight="700" text-anchor="middle">查核證據</text>
  <circle cx="900" cy="120" r="46" fill="#1F3A5F"/>
  <text x="900" y="138" font-size="46" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">5</text>
  <text x="900" y="222" font-size="24" fill="#1D2433" font-weight="700" text-anchor="middle">期後事項、</text>
  <text x="900" y="254" font-size="24" fill="#1D2433" font-weight="700" text-anchor="middle">繼續經營</text>
  <circle cx="1100" cy="120" r="46" fill="#C8892B"/>
  <text x="1100" y="138" font-size="46" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">6</text>
  <text x="1100" y="222" font-size="24" fill="#1D2433" font-weight="700" text-anchor="middle">出具</text>
  <text x="1100" y="254" font-size="24" fill="#1D2433" font-weight="700" text-anchor="middle">查核報告</text>

