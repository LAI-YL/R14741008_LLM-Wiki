<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif">
  <title>期後事項時間軸</title>
  <path d="M60 250 H1040" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round"/>
  <path d="M1020 236 L1046 250 L1020 264" fill="none" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="330" cy="250" r="16" fill="#1F3A5F"/>
  <circle cx="330" cy="250" r="6" fill="#C8892B"/>
  <text x="330" y="305" font-size="28" fill="#1D2433" font-weight="700" text-anchor="middle">資產負債表日</text>
  <text x="330" y="338" font-size="20" fill="#5A6275" font-weight="400" text-anchor="middle">期末</text>
  <circle cx="800" cy="250" r="16" fill="#1F3A5F"/>
  <circle cx="800" cy="250" r="6" fill="#C8892B"/>
  <text x="800" y="305" font-size="28" fill="#1D2433" font-weight="700" text-anchor="middle">查核報告日</text>
  <rect x="346" y="226" width="438" height="48" rx="8" fill="#FBF1E0" opacity=".9"/>
  <text x="565" y="259" font-size="24" fill="#8A5A12" font-weight="700" text-anchor="middle">期後事項發生在這段期間</text>
  <rect x="60" y="380" width="470" height="200" rx="16" fill="#E6ECF4" stroke="#1F3A5F" stroke-width="2.5"/>
  <text x="90" y="428" font-size="30" fill="#1F3A5F" font-weight="700" text-anchor="start">Type 1｜調整事項</text>
  <text x="90" y="474" font-size="24" fill="#1D2433" font-weight="400" text-anchor="start">狀況在期末「已存在」</text>
  <text x="90" y="512" font-size="24" fill="#1D2433" font-weight="700" text-anchor="start">→ 調整財報數字</text>
  <text x="90" y="552" font-size="20" fill="#5A6275" font-weight="400" text-anchor="start">例：客戶期後破產（期末已有困難）</text>
  <rect x="570" y="380" width="470" height="200" rx="16" fill="#FBF1E0" stroke="#C8892B" stroke-width="2.5"/>
  <text x="600" y="428" font-size="30" fill="#8A5A12" font-weight="700" text-anchor="start">Type 2｜非調整事項</text>
  <text x="600" y="474" font-size="24" fill="#1D2433" font-weight="400" text-anchor="start">狀況在期末「之後才發生」</text>
  <text x="600" y="512" font-size="24" fill="#1D2433" font-weight="700" text-anchor="start">→ 不改數字，重大者揭露</text>
  <text x="600" y="552" font-size="20" fill="#5A6275" font-weight="400" text-anchor="start">例：期後廠房火災</text>
  <text x="550" y="70" font-size="32" fill="#1F3A5F" font-weight="700" text-anchor="middle">判斷關鍵：狀況在期末是否已經存在</text>
  <text x="550" y="112" font-size="22" fill="#5A6275" font-weight="400" text-anchor="middle">（不是消息何時知道）</text>

</svg>
