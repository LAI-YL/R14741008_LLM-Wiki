<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>會計師服務的確信程度</title>
  <rect x="40" y="40" width="920" height="140" rx="16" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2.5"/>
  <text x="70" y="96" font-size="34" fill="#FFFFFF" font-weight="700" text-anchor="start" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">合理確信</text>
  <text x="70" y="132" font-size="18" fill="#FFFFFF" font-weight="400" text-anchor="start">Reasonable Assurance</text>
  <text x="930" y="100" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="end">財報查核、SSAE 檢查</text>
  <text x="930" y="138" font-size="18" fill="#FFFFFF" font-weight="400" text-anchor="end">結論：In our opinion…</text>
  <rect x="40" y="200" width="800" height="140" rx="16" fill="#E6ECF4" stroke="#1F3A5F" stroke-width="2.5"/>
  <text x="70" y="256" font-size="34" fill="#1F3A5F" font-weight="700" text-anchor="start" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">有限確信</text>
  <text x="70" y="292" font-size="18" fill="#5A6275" font-weight="400" text-anchor="start">Limited Assurance</text>
  <text x="810" y="260" font-size="24" fill="#1F3A5F" font-weight="700" text-anchor="end">SSAE 核閱、SSARS 核閱</text>
  <text x="810" y="298" font-size="18" fill="#5A6275" font-weight="400" text-anchor="end">結論：We are not aware of…</text>
  <rect x="40" y="360" width="680" height="140" rx="16" fill="#FBF1E0" stroke="#C8892B" stroke-width="2.5"/>
  <text x="70" y="416" font-size="34" fill="#8A5A12" font-weight="700" text-anchor="start" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">不提供確信</text>
  <text x="70" y="452" font-size="18" fill="#5A6275" font-weight="400" text-anchor="start">No Assurance</text>
  <text x="690" y="420" font-size="24" fill="#8A5A12" font-weight="700" text-anchor="end">協議程序、代編、編製</text>
  <text x="690" y="458" font-size="18" fill="#5A6275" font-weight="400" text-anchor="end">只列事實發現，或不出報告</text>
  <path d="M990 62 V484" stroke="#5A6275" stroke-width="3" stroke-linecap="round"/>
  <path d="M978 74 L990 52 L1002 74" fill="none" stroke="#5A6275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="990" y="36" font-size="22" fill="#5A6275" font-weight="700" text-anchor="middle">高</text>
  <text x="990" y="508" font-size="22" fill="#5A6275" font-weight="700" text-anchor="middle">低</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
