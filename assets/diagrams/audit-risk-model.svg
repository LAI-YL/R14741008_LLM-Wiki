<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>審計風險模型</title>
  <rect x="40" y="60" width="180" height="130" rx="16" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/>
  <text x="130" y="128" font-size="48" fill="#1F3A5F" font-weight="700" text-anchor="middle" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">AR</text>
  <text x="130" y="170" font-size="24" fill="#1D2433" font-weight="600" text-anchor="middle">審計風險</text>
  <rect x="300" y="60" width="180" height="130" rx="16" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/>
  <text x="390" y="128" font-size="48" fill="#1F3A5F" font-weight="700" text-anchor="middle" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">IR</text>
  <text x="390" y="170" font-size="24" fill="#1D2433" font-weight="600" text-anchor="middle">固有風險</text>
  <rect x="560" y="60" width="180" height="130" rx="16" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/>
  <text x="650" y="128" font-size="48" fill="#1F3A5F" font-weight="700" text-anchor="middle" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">CR</text>
  <text x="650" y="170" font-size="24" fill="#1D2433" font-weight="600" text-anchor="middle">控制風險</text>
  <rect x="820" y="60" width="180" height="130" rx="16" fill="#FBF1E0" stroke="#C8892B" stroke-width="3"/>
  <text x="910" y="128" font-size="48" fill="#C8892B" font-weight="700" text-anchor="middle" font-family="'Noto Serif TC','Songti TC','PMingLiU',Georgia,serif">DR</text>
  <text x="910" y="170" font-size="24" fill="#1D2433" font-weight="600" text-anchor="middle">偵查風險</text>
  <text x="250" y="140" font-size="48" fill="#5A6275" font-weight="400" text-anchor="middle">=</text>
  <text x="510" y="140" font-size="48" fill="#5A6275" font-weight="400" text-anchor="middle">×</text>
  <text x="770" y="140" font-size="48" fill="#5A6275" font-weight="400" text-anchor="middle">×</text>
  <path d="M300 215 v18 h440 v-18" fill="none" stroke="#1F3A5F" stroke-width="3"/>
  <text x="520" y="268" font-size="26" fill="#1F3A5F" font-weight="700" text-anchor="middle">重大不實表達風險 RMM</text>
  <text x="520" y="302" font-size="20" fill="#5A6275" font-weight="400" text-anchor="middle">受查者本身的風險：查核人員只能「評估」</text>
  <path d="M820 215 v18 h180 v-18" fill="none" stroke="#C8892B" stroke-width="3"/>
  <text x="910" y="268" font-size="24" fill="#8A5A12" font-weight="700" text-anchor="middle">查核人員能「控制」</text>
  <text x="910" y="302" font-size="18" fill="#5A6275" font-weight="400" text-anchor="middle">調整程序的性質、時間、範圍</text>
  <rect x="60" y="380" width="280" height="84" rx="42" fill="#E6ECF4" stroke="#1F3A5F" stroke-width="2.5"/>
  <text x="200" y="432" font-size="26" fill="#1D2433" font-weight="700" text-anchor="middle">RMM 越高</text>
  <path d="M350 422 h30 m-12 -10 l12 10 l-12 10" fill="none" stroke="#5A6275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="390" y="380" width="280" height="84" rx="42" fill="#E6ECF4" stroke="#1F3A5F" stroke-width="2.5"/>
  <text x="530" y="432" font-size="26" fill="#1D2433" font-weight="700" text-anchor="middle">可接受的 DR 越低</text>
  <path d="M680 422 h30 m-12 -10 l12 10 l-12 10" fill="none" stroke="#5A6275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="720" y="380" width="280" height="84" rx="42" fill="#FBF1E0" stroke="#C8892B" stroke-width="2.5"/>
  <text x="860" y="432" font-size="26" fill="#1D2433" font-weight="700" text-anchor="middle">需要更多查核證據</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
